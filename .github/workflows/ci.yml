name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt pytest==9.1.1
      # Tests that need the raw downloaded data skip themselves when it is absent.
      - run: make test

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # web/build.py only needs the standard library and the committed web/public/data.
      - run: python web/build.py
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # the game's physics (rigid vehicles, ragdolls) has no dependencies, so Node runs it as is
      - run: node --test web/test/*.test.mjs
